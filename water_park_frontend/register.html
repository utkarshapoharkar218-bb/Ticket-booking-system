<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Fun & Food Water Park</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>

<body>

<header class="header">
<div class="logo">
<span class="logo-icon">💦</span>
<h1>Fun & Food Water Park</h1>
</div>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="booking.html">Book Ticket</a>
<a href="food.html">Food Booking</a>
<a href="stay.html">Stay Booking</a>
<a href="login.html">Login</a>
<a href="register.html" class="active">Register</a>
</nav>
</header>

<section class="login-section">
<div class="login-box">
<h2>📝 Create Your Account</h2>

<form id="registerForm">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter Full Name" required>

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create a Password" required minlength="6">

<div class="button-group">
<button type="reset" class="reset-btn">Reset</button>
<button type="submit" class="book-btn">Register</button>
</div>
</form>

<p class="login-note">
Already have an account? <a href="login.html">Login here</a>
</p>
</div>
</section>

<footer class="footer">
<p>© 2026 Fun & Food Water Park | All Rights Reserved.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/register.js"></script>

</body>
</html>
